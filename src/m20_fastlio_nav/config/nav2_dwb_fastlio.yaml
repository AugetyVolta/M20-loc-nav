controller_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 45.0

    general_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.80
      max_vel_y: 0.0
      max_vel_theta: 0.65

      # 保留底盘死区：非零线速度不低于 0.20，非零角速度不低于 0.40。
      # 角速度不能放得过激，否则 DWB 容易在本该直走时选择原地掉头。
      # 死区主要靠 min_speed_theta 处理，velocity_smoother 不再二次截断。
      min_speed_xy: 0.20
      max_speed_xy: 0.80
      min_speed_theta: 0.50

      acc_lim_x: 1.50
      acc_lim_y: 0.0
      acc_lim_theta: 4.60
      decel_lim_x: -3.50
      decel_lim_y: 0.0
      decel_lim_theta: -4.60

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 31
      sim_time: 2.0
      linear_granularity: 0.03
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.15
      short_circuit_trajectory_evaluation: true
      stateful: false

      critics: ["ObstacleFootprint", "BaseObstacle", "PathAlign", "PathDist", "GoalDist", "RotateToGoal"]
      ObstacleFootprint.scale: 0.02
      BaseObstacle.scale: 0.03
      PathAlign.scale: 26.0
      PathAlign.forward_point_distance: 0.40
      PathDist.scale: 28.0
      GoalDist.scale: 6.0
      RotateToGoal.scale: 10.0
      RotateToGoal.slowing_factor: 4.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False  # 真机若没有 /clock，请改成 False
      footprint_padding: 0.03
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom_nav
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[[0.410, 0.253], [0.410, -0.253], [-0.410, -0.253], [-0.410, 0.253]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.6

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: True

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False  # 真机若没有 /clock，请改成 False
      footprint_padding: 0.03
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.410, 0.253], [0.410, -0.253], [-0.410, -0.253], [-0.410, 0.253]]"
      resolution: 0.05
      transform_tolerance: 0.3
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    yaml_filename: "/mnt/nvme/workspace/fast_lio_ws/maps/fastlio/m20_2d_map.yaml"
    topic_name: "map"
    frame_id: "map"

planner_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

velocity_smoother:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    smoothing_frequency: 15.0
    scale_velocities: False
    feedback: "OPEN_LOOP"

    max_velocity: [0.8, 0.0, 0.65]
    min_velocity: [0.0, 0.0, -0.65]

    max_accel: [1.5, 0.0, 4.6]
    max_decel: [-3.5, 0.0, -4.6]

    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
