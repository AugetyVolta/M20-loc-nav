controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: /odom_body
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 45.0

    general_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.60
      max_vel_y: 0.0
      max_vel_theta: 0.65

      # Keep the stable 2D DWB tuning; only cap forward speed for 3D testing.
      min_speed_xy: 0.20
      max_speed_xy: 0.60
      min_speed_theta: 0.40

      acc_lim_x: 1.20
      acc_lim_y: 0.0
      acc_lim_theta: 4.30
      decel_lim_x: -1.50
      decel_lim_y: 0.0
      decel_lim_theta: -4.60

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 31
      sim_time: 1.45
      linear_granularity: 0.03
      angular_granularity: 0.025
      transform_tolerance: 0.1
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.08
      short_circuit_trajectory_evaluation: false
      stateful: false

      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalDist", "RotateToGoal"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 26.0
      PathAlign.forward_point_distance: 0.40
      PathDist.scale: 34.0
      GoalDist.scale: 6.0
      RotateToGoal.scale: 10.0
      RotateToGoal.slowing_factor: 4.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      footprint_padding: 0.03
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom_body
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.2
      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      robot_radius: 0.35
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.6

      always_send_full_costmap: True

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 15.0
    scale_velocities: False
    feedback: "OPEN_LOOP"

    max_velocity: [0.60, 0.0, 0.65]
    min_velocity: [0.0, 0.0, -0.65]

    max_accel: [0.9, 0.0, 4.3]
    max_decel: [-1.1, 0.0, -4.6]

    odom_topic: "/odom_body"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
