controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: /odom_body
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 45.0

    general_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.70
      max_vel_y: 0.0
      max_vel_theta: 0.65

      # Keep the stable 2D DWB tuning; only cap forward speed for 3D testing.
      min_speed_xy: 0.00
      max_speed_xy: 0.70
      min_speed_theta: 0.40

      acc_lim_x: 1.20
      acc_lim_y: 0.0
      acc_lim_theta: 4.30
      decel_lim_x: -1.50
      decel_lim_y: 0.0
      decel_lim_theta: -4.60

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 31
      sim_time: 1.45
      linear_granularity: 0.03
      angular_granularity: 0.025
      transform_tolerance: 0.1
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.08
      short_circuit_trajectory_evaluation: false
      stateful: false

      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalDist", "RotateToGoal"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 26.0
      PathAlign.forward_point_distance: 0.40
      PathDist.scale: 34.0
      GoalDist.scale: 6.0
      RotateToGoal.scale: 10.0
      RotateToGoal.slowing_factor: 4.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      footprint_padding: 0.03
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom_body
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      transform_tolerance: 0.2
      # base_link 位于机身中心；Lbody=0.82m, Wbody=0.506m。
      # Nav2 footprint 使用 base_link 坐标系: x 向前, y 向左。
      footprint: "[ [0.410, 0.253], [0.410, -0.253], [-0.410, -0.253], [-0.410, 0.253] ]"
      robot_radius: 0.35
      plugins: ["traversability_layer", "inflation_layer"]

      traversability_layer:
        # 插件类名，必须和 traversability_layer_plugin.xml 导出的类一致。
        plugin: "traversability_layer::TraversabilityLayer"

        # 是否启用这一层。false 时插件还会加载，但不会往 local costmap 写代价。
        enabled: true

        # 输入点云。算法阈值保持源码默认，但话题必须匹配当前 M20 Fast-LIO 输出。
        # 如果这个话题没数据，local costmap 就不会得到三维可通行性信息。
        pointcloud_topic: /cloud_registered_body_1

        # 点云坐标系覆盖。空字符串表示使用 PointCloud2 header.frame_id。
        # 只有当点云 header.frame_id 不可靠时，才手动填 base_link/livox_frame/body 等。
        sensor_frame: ""

        # 机器人高度参考坐标系。min/max_obstacle_height 都是相对这个 frame 的 z 高度。
        # 当前 Nav2 local_costmap.robot_base_frame 是 base_link，这里要保持一致。
        # 源码默认 base_footprint 不是本工程的 DWB 底盘 frame。
        base_frame: base_link

        # 参与分析的最低点云高度，相对 base_frame，单位 m。
        # 更小会保留更低的地面/下台阶点；太小可能引入地面以下噪声。
        min_obstacle_height: -0.3

        # 参与分析的最高点云高度，相对 base_frame，单位 m。
        # 更大能看到高障碍；太大可能引入天花板/上层结构并增加计算量。
        max_obstacle_height: 2.0

        # 最大可通行坡度，单位度。坡度角超过它会直接写 LETHAL_OBSTACLE。
        # 调大更容易允许斜坡/楼梯；调小更保守。
        max_slope_traversable: 85.0

        # 坡度代价开始角，单位度。超过它但没超过 max_slope_traversable 时开始加 cost。
        # 调大可减少缓坡/台阶带来的软代价；调小会更早避开斜面。
        slope_cost_start: 70.0

        # 台阶/垂直高度阈值，单位 m。
        # 地面上方障碍高度或邻域高度差超过它时会进入高代价/致命判断。
        # 调大更容易放行楼梯；调小更容易把台阶边缘当障碍。
        step_height_threshold: 0.40

        # 高度差开始产生 cost 的阈值，单位 m。
        # 小于它的起伏基本当作平地；调大可忽略小噪声和低矮纹理。
        height_cost_start: 0.18

        # 坡度 cost 缩放系数。只影响非 lethal 的软代价大小。
        # 调大后 DWB 更不愿走斜坡；调小后斜坡代价更弱。
        slope_cost_scale: 5.0

        # 高度 cost 缩放系数。当前源码主要用分段逻辑计算高度 cost，
        # 这个参数保留用于兼容旧版逻辑/声明，实际影响较弱。
        height_cost_scale: 10.0

        # 致命代价阈值。Nav2 costmap 中 254 通常表示 LETHAL_OBSTACLE。
        lethal_cost_threshold: 254.0

        # 观测保留时间，单位秒。0 表示只用最新帧；>0 会累积短时历史并衰减。
        # 调大能减少点云缺帧导致的闪烁；太大会让旧障碍残留。
        observation_persistence: 1.0

        # 点云订阅队列长度。大一点抗突发延迟，小一点更实时。
        cloud_buffer_size: 5

        # 是否发布调试点云 slope_map，用 intensity 表示 cost，方便 RViz 看可通行性结果。
        publish_slope_map: true

        # 订阅原始 /scan，按 traversability cost 过滤后发布给 PCT 全局动态避障使用。
        # 只有 endpoint 落在已知高代价格子时才保留；可通行、未知、无地面区域都会置为 inf。
        publish_filtered_scan: true
        filtered_scan_input_topic: /scan
        filtered_scan_topic: /traversability_filtered_scan
        filtered_scan_min_cost: 160.0

        # traversability 内部二维地面网格分辨率，单位 m。
        # 0 或负数会使用 costmap resolution。越小越细，但 CPU/内存更高。
        cell_resolution: 0.0

        # OpenMP 线程数。0 表示系统默认；-1 表示单线程；正数表示固定线程数。
        num_threads: 0

        # Z 方向体素分辨率，单位 m。
        # 越小越能分辨台阶高度，但计算和内存增加；楼梯建议 0.05 左右。
        voxel_z_resolution: 0.05

        # 判定一个体素有点云命中的最小 hit 数。
        # 调大可滤噪，但稀疏点云下可能漏检地面/台阶。
        ground_hit_threshold: 1

        # 射线穿过体素的最小 pass 数，用于判断某个 hit 上方是否是 free space。
        # 调大更保守，但可能让地面提取变少。
        free_space_threshold: 1

        # 在地面候选点上方查找 free space 的 Z 向窗口，单位是 voxel 层数。
        # 例如 voxel_z_resolution=0.05、window=3，约看上方 0.15m。
        free_space_window: 3

        # 地面缺失格子的插值搜索半径，单位是 cell 数。
        # 调大能补洞，但可能把墙边/楼梯边缘抹平。
        interp_search_radius: 3

        # 插值所需的最少邻居数量。调大更可靠但补洞更少；调小补洞更多但可能误补。
        min_interp_neighbors: 2

        # 地面上方障碍体素占比阈值。
        # 墙体通常占比高，楼梯踏面/边缘占比低；调大更容易放行楼梯，调小更容易挡住墙。
        obstacle_ratio_threshold: 0.75

        # 判定某个上方体素是障碍体素的最小 hit 数。
        # 调大可过滤噪声；调小对细障碍更敏感。
        obstacle_hit_threshold: 4

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.6

      always_send_full_costmap: True

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 15.0
    scale_velocities: False
    feedback: "OPEN_LOOP"

    max_velocity: [0.70, 0.0, 0.65]
    min_velocity: [0.0, 0.0, -0.65]

    max_accel: [0.9, 0.0, 4.3]
    max_decel: [-1.1, 0.0, -4.6]

    odom_topic: "/odom_body"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
