global_localization_node:
  ros__parameters:
    path_map: "/mnt/nvme/workspace/fast_lio_ws/maps/fastlio/m20_map_leveled.pcd"

    # x, y, z, roll, pitch, yaw in degrees. You can still refine this from RViz
    # with 2D Pose Estimate after the node starts.
    initialpose: [0.0, 0.0, 0.0, -1.252570, 24.985557, 1.283876]

    pcd_queue_maxsize: 10
    voxelsize_coarse: 0.15
    voxelsize_fine: 0.10
    threshold_fitness_init: 0.50
    threshold_fitness: 0.50
    loc_frequence: 2.5
    save_scan: false
    hidden_removal: false
    maxpoints_source: 80000
    maxpoints_target: 400000
    filter_odom2map: false
    kalman_processVar2: 0.001
    kalman_estimatedMeasVar2: 0.02
    confidence_loc_th: 0.70
    dis_updatemap: 3.5
    reset_fastlio_on_initialpose: true
    fastlio_reset_service: "/fastlio_localization_odom/reset_localization"
    reset_on_sensor_wall_gap: false
    bag_switch_wall_gap_sec: 1.5

    kf_baselink2map:
      x: [0.001, 0.002]
      y: [0.001, 0.005]
      z: [0.00001, 0.04]
