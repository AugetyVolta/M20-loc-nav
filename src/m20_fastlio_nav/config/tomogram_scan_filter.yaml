tomogram_scan_filter_node:
  ros__parameters:
    # 输入 Fast-LIO 当前帧三维点云，直接在保留真实 Z 的情况下生成 LaserScan。
    input_cloud_topic: /cloud_registered_body_1
    # 主导航专用表面话题，避免和 tomography 调试时发布的 /tomogram 混用。
    tomogram_topic: /traversability_tomogram
    output_scan_topic: /traversability_filtered_scan
    map_frame: map
    base_frame: base_link
    enabled: true

    # 覆盖机器狗可碰撞高度；上侧适当放宽以保留稀疏栏杆立柱和横杆回波。
    min_height: -0.10
    max_height: 0.80
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087
    scan_time: 0.10
    range_min: 0.15
    range_max: 10.0

    # 必须与 m20_3d_map.pickle 中记录的 resolution 一致。
    tomogram_grid_resolution: 0.20

    # 点的 XY 距离某个可通行 tomogram cell 不超过该值，才可能被判断为地面。
    # 0.20m 网格中心到角点约 0.141m；额外余量用于覆盖交界处的定位和离散误差。
    ground_xy_tolerance: 0.20

    # 点相对 tomogram 地面高度的允许范围，单位 m。
    # 范围内的点作为地面/楼梯踏面删除；超出该高度带的栏杆、人和障碍继续保留。
    ground_z_min_offset: -0.2
    ground_z_max_offset: 0.22

    # 只有 tomogram cost 不超过该值的表面才作为可通行地面。
    # 主 launch 会让 /tomogram 发布端使用同一个 PCT A* cost 阈值。
    traversable_cost_max: 45.0

    transform_tolerance: 0.10
    use_latest_transform_fallback: true

    # true 表示 tomogram 没覆盖的区域保留点云，避免误删未知障碍和稀疏栏杆。
    keep_points_without_ground: true

    # tomogram 是静态地图，默认收到第一份后不重复重建索引。
    reload_tomogram: false

    # 拒绝空地图、测试地图或尚未发布完整的 tomogram，避免错误首帧锁死过滤器。
    # 当前 m20 tomogram 约有 4.9 万个可通行点，1000 只作为完整性下限。
    min_tomogram_points: 1000
