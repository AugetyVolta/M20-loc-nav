pct_planner_node:
  ros__parameters:
    pct_root: ""
    tomogram_file: "m20_3d_map"
    frame_id: "map"
    path_topic: "/pct_path"

    # Use "tf" in the robot stack so the global path starts at map->base_link.
    # "odom" and "fixed" are kept for debugging.
    start_source: "fixed"
    odom_topic: "/odom_body"
    global_frame: "map"
    robot_frame: "base_link"

    goal_pose_topic: "/goal_pose"
    clicked_point_topic: "/clicked_point"
    start_point_topic: "/pct_start_point"
    goal_point_topic: "/pct_goal_point"
    initial_start: [0.0, 0.0, 0.5]
    initial_goal: [5.0, 0.0, 0.5]

    use_interactive_markers: true
    marker_namespace: "basic_controls"
    marker_z_offset: 0.5
    replan_interval: 1.0
    position_epsilon: 0.01
    auto_plan: true

    # Upstream planner_wrapper hard-coded these as init_map(20, 15, ..., 1).
    # Stairs often have high traversability cost but are not absolute barriers,
    # so m20 can raise a_star_cost_threshold when testing stair traversal.
    a_star_cost_threshold: 20.0
    safe_cost_margin: 15.0
    step_cost_weight: 1.0
    layer_match_height_tolerance: 1.0
