pct_planner_node:
  ros__parameters:
    pct_root: ""
    tomogram_file: "m20_3d_map"
    frame_id: "map"
    path_topic: "/pct_path"
    # Static route is published separately and never contains dynamic obstacles.
    # Terrain classification consumes this latched path.
    reference_path_topic: "/pct/reference_path"
    # Dynamic perception policy is supplied by the integration-level mode manager.
    navigation_mode_topic: "/navigation_mode"

    # Use "tf" so the global path starts from the current map->base_link pose.
    # Override to "fixed" only for offline/debug visualization without TF.
    start_source: "tf"
    odom_topic: "/odom_body"
    global_frame: "map"
    robot_frame: "base_link"

    goal_pose_topic: "/goal_pose"
    clicked_point_topic: "/clicked_point"
    start_point_topic: "/pct_start_point"
    goal_point_topic: "/pct_goal_point"
    initial_start: [0.0, 0.0, 0.5]
    initial_goal: [5.0, 0.0, 0.5]

    use_interactive_markers: true
    marker_namespace: "basic_controls"
    marker_z_offset: 0.5
    replan_interval: 1.0
    auto_plan: true
    always_replan: true

    # Main PCT traversability threshold. The M20 launch overrides this to 45.0
    # for stair-friendly navigation.
    a_star_cost_threshold: 20.0
    layer_match_height_tolerance: 1.2
    # Desired optimized path height above the tomogram terrain surface, in metres.
    path_ground_offset: 0.10
    # base_link is at the body centre, while tomogram elevations describe the
    # terrain surface. Subtract this only when matching the robot to a layer.
    robot_ground_offset: 0.45

    # Optional global-path perception update. This mirrors the small set of
    # knobs used by Nav2's local costmap/inflation layer; advanced filtering
    # and layer-matching settings use pct_planner_node defaults.
    global_path_perception_enabled: false
    # One raw scan frame first raytraces free space and then marks finite hits.
    global_path_perception_scan_topic: "/scan"
    # Match pointcloud_to_laserscan.range_min. No extra robot-radius or
    # footprint suppression is applied to finite scan endpoints.
    global_path_perception_min_range: 0.15
    global_path_perception_width: 8.0
    global_path_perception_height: 8.0
    # Consume at most one scan every 0.2 s (5 Hz). Path replanning remains
    # independent at replan_interval=1.0 s (1 Hz).
    global_path_perception_update_interval: 0.2
    global_path_perception_inflation_radius: 1.0
    global_path_perception_inscribed_radius: 0.45
    global_path_perception_cost_scaling_factor: 5.0
    global_path_perception_persistence: 1.0
    # Apply one 2D scan obstacle to overlapping tomogram layers representing
    # the same physical surface, without marking a different floor.
    global_path_perception_height_tolerance: 0.75
    global_path_perception_mark_all_layers: false

    # Keep a static route to the final goal and select an anchor this far ahead.
    # The implementation optimizes an additional configurable reference overlap
    # and constrains its terminal heading before joining the unchanged suffix.
    # A* has no lateral search bounds.
    local_replan_enabled: true
    local_replan_forward_distance: 10.0
    # Optimize this additional static-reference distance beyond the nominal
    # local window before joining the untouched suffix, reducing join corners.
    local_replan_join_extension: 2.0
    # Rebuild the static route from the current base_link pose when the robot
    # leaves the old route by more than this 3D distance.
    reference_rebuild_distance: 2.0
    # Rebuild after the robot moves this far backwards along the accepted route.
    # Set to 0.0 to disable backwards-progress detection.
    reference_rebuild_backtrack_distance: 0.6
