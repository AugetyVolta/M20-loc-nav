pct_planner_node:
  ros__parameters:
    pct_root: ""
    tomogram_file: "m20_3d_map"
    frame_id: "map"
    path_topic: "/pct_path"

    # Use "tf" in the robot stack so the global path starts at map->base_link.
    # "odom" and "fixed" are kept for debugging.
    start_source: "fixed"
    odom_topic: "/odom_body"
    global_frame: "map"
    robot_frame: "base_link"

    goal_pose_topic: "/goal_pose"
    clicked_point_topic: "/clicked_point"
    start_point_topic: "/pct_start_point"
    goal_point_topic: "/pct_goal_point"
    initial_start: [0.0, 0.0, 0.5]
    initial_goal: [5.0, 0.0, 0.5]

    use_interactive_markers: true
    marker_namespace: "basic_controls"
    marker_z_offset: 0.5
    replan_interval: 1.0
    position_epsilon: 0.01
    auto_plan: true
    always_replan: false

    # Main PCT traversability threshold. The M20 launch overrides this to 45.0
    # for stair-friendly navigation.
    a_star_cost_threshold: 20.0
    max_heading_rate: 10.0
    layer_match_height_tolerance: 1.2

    # Optional global-path perception update. This mirrors the small set of
    # knobs used by Nav2's local costmap/inflation layer; advanced filtering
    # and layer-matching settings use pct_planner_node defaults.
    global_path_perception_enabled: false
    global_path_perception_scan_topic: "/scan"
    global_path_perception_width: 4.0
    global_path_perception_height: 4.0
    global_path_perception_inflation_radius: 0.60
    global_path_perception_cost_scaling_factor: 5.0
    global_path_perception_persistence: 1.0
