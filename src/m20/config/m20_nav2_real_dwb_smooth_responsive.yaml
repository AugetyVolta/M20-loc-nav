bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False

controller_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.0
      max_vel_y: 0.0
      max_vel_theta: 0.60

      # 保留底盘死区：非零线速度不低于 0.20，非零角速度不低于 0.40。
      # 平滑性主要交给高采样密度和 velocity_smoother 处理。
      min_speed_xy: 0.20
      max_speed_xy: 1.0
      min_speed_theta: 0.40

      acc_lim_x: 1.20
      acc_lim_y: 0.0
      acc_lim_theta: 3.20
      decel_lim_x: -1.50
      decel_lim_y: 0.0
      decel_lim_theta: -3.80

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 25
      sim_time: 1.45
      linear_granularity: 0.03
      angular_granularity: 0.025
      transform_tolerance: 0.1
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.08
      short_circuit_trajectory_evaluation: false
      stateful: false

      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalDist", "RotateToGoal"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 26.0
      PathAlign.forward_point_distance: 0.40
      PathDist.scale: 34.0
      GoalDist.scale: 6.0
      RotateToGoal.scale: 10.0
      RotateToGoal.slowing_factor: 4.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False  # 真机若没有 /clock，请改成 False
      footprint_padding: 0.03
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.2
      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      robot_radius: 0.35
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.6

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: True

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False  # 真机若没有 /clock，请改成 False
      footprint_padding: 0.25
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      robot_radius: 0.35
      resolution: 0.05
      transform_tolerance: 0.2
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.8

      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    yaml_filename: ""
    topic_name: "map"
    frame_id: "map"

map_saver:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 500
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false  # 真机若没有 /clock，请改成 False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0

    # 与你的死区保持一致，但别把恢复动作转得过猛
    max_rotational_vel: 0.6
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False

waypoint_follower:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    loop_rate: 10
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"

    max_velocity: [1.0, 0.0, 0.6]
    min_velocity: [0.0, 0.0, -0.6]

    max_accel: [0.9, 0.0, 3.0]
    max_decel: [-1.1, 0.0, -3.5]

    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
