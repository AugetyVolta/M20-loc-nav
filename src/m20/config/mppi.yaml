controller_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    controller_frequency: 8.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      visualize: false

      time_steps: 15
      model_dt: 0.125
      batch_size: 250
      iteration_count: 1
      prune_distance: 3.0
      transform_tolerance: 0.1
      regenerate_noises: false
      reset_period: 1.0

      vx_max: 0.60
      vx_min: 0.00
      vy_max: 0.00
      wz_max: 0.60

      vx_std: 0.20
      vy_std: 0.00
      wz_std: 0.12

      ax_max: 2.00
      ax_min: -2.00
      ay_max: 0.00
      ay_min: -3.00
      az_max: 2.00

      temperature: 0.30
      gamma: 0.015

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false

      AckermannConstraints:
        min_turning_r: 0.2

      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "VelocityDeadbandCritic",
          "ObstaclesCritic"
        ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: false
        cost_power: 1
        cost_weight: 0.5
        critical_cost: 300.0
        consider_footprint: false
        near_goal_distance: 1.0
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.3

      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 1.5
        offset_from_furthest: 10
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        offset_from_furthest: 6
        threshold_to_consider: 2.0

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 8
        threshold_to_consider: 1.2
        max_angle_to_furthest: 1.0
        mode: 0

      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        deadband_velocities: [0.2, 0.0, 0.25]

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.35
        critical_weight: 8.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.08
        near_goal_distance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False  # 真机若没有 /clock，请改成 False
      footprint_padding: 0.03
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.2
      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      robot_radius: 0.35
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.6

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: True

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False  # 真机若没有 /clock，请改成 False
      footprint_padding: 0.25
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[ [0.14, 0.25], [0.14, -0.25], [-0.607, -0.25], [-0.607, 0.25] ]"
      robot_radius: 0.35
      resolution: 0.05
      transform_tolerance: 0.2
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.8

      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    yaml_filename: ""
    topic_name: "map"
    frame_id: "map"

map_saver:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 500
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false  # 真机若没有 /clock，请改成 False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0

    # 与你的死区保持一致，但别把恢复动作转得过猛
    max_rotational_vel: 0.6
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False

waypoint_follower:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False  # 真机若没有 /clock，请改成 False
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"

    max_velocity: [0.6, 0.0, 0.6]
    min_velocity: [0.0, 0.0, -0.6]

    max_accel: [2.0, 0.0, 5.0]
    max_decel: [-2.0, 0.0, -5.0]

    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.05, 0.0, 0.4]
    velocity_timeout: 1.0
